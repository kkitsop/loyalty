<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOFI Project - Loyalty</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #1e1e1e; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); text-align: center; width: 350px; }
        h1 { color: #d4af37; margin-bottom: 10px; font-size: 24px; }
        p { color: #aaa; font-size: 14px; margin-bottom: 25px; }
        .btn { background: #d4af37; color: #121212; border: none; padding: 12px 20px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; }
        .btn:hover { background: #e5c158; }
        .status { margin-top: 15px; font-size: 13px; color: #4caf50; }
    </style>
</head>
<body>

    <div class="card">
        <h1>KOFI Project</h1>
        <p>Σύστημα Διαχείρισης & Loyalty</p>
        <button class="btn" onclick="startApp()">Είσοδος στο Σύστημα</button>
        <div id="status" class="status"></div>
    </div>

    <script>
        function startApp() {
            document.getElementById('status').innerText = 'Επιτυχής σύνδεση! Το σύστημα είναι έτοιμο.';
            // Εδώ θα μπει η κανονική λειτουργία του ταμείου σου αμέσως μόλις επιβεβαιώσουμε ότι φορτώνει καθαρά.
        }
    </script>

</body>
</html>
