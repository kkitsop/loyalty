<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOFI Project - Σύστημα Loyalty</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --accent: #d4af37; --text: #fff; --text-dim: #aaa; --danger: #cf6679; }
        body { font-family: Arial, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); margin-bottom: 20px; }
        h1, h2 { color: var(--accent); text-align: center; margin-top: 0; }
        input { width: 100%; padding: 12px; margin: 8px 0 15px 0; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        .btn { background: var(--accent); color: #121212; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; }
        .btn:hover { background: #e5c158; }
        .customer-info { background: #252525; padding: 15px; border-radius: 8px; margin-top: 15px; }
        .points-display { font-size: 24px; color: var(--accent); font-weight: bold; text-align: center; margin: 10px 0; }
        .actions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .btn-action { padding: 12px; font-weight: bold; border-radius: 6px; border: none; cursor: pointer; color: #fff; }
        .btn-add { background: #4caf50; }
        .btn-redeem { background: #e64a19; }
        .log-list { font-size: 13px; color: var(--text-dim); max-height: 150px; overflow-y: auto; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <h1>☕ KOFI Project</h1>
            <h2>Σύστημα Loyalty</h2>
            
            <label for="phoneInput">Αριθμός Κινητού Πελάτη:</label>
            <input type="tel" id="phoneInput" placeholder="π.χ. 6912345678" maxlength="10">
            <button class="btn" onclick="searchCustomer()">Αναζήτηση / Εγγραφή</button>

            <div id="customerSection" style="display:none;" class="customer-info">
                <div id="customerName" style="font-weight: bold; font-size: 18px; text-align: center;"></div>
                <div class="points-display"><span id="customerPoints">0</span> Πόντοι</div>
                
                <div class="actions-grid">
                    <button class="btn-action btn-add" onclick="addPoints(1)">+1 Πόντος</button>
                    <button class="btn-action btn-redeem" onclick="redeemPoints()">Εξαργύρωση</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Εδώ συνδέεσαι κανονικά με τη Supabase σου (Βάλτε τα δικά σας στοιχεία αν χρειαστεί)
        const SUPABASE_URL = 'https://YOUR_SUPABASE_PROJECT.supabase.co';
        const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentCustomer = null;

        async function searchCustomer() {
            const phone = document.getElementById('phoneInput').value.trim();
            if (phone.length < 10) {
                alert('Παρακαλώ εισάγετε έγκυρο αριθμό κινητού 10 ψηφίων.');
                return;
            }

            // Παράδειγμα διασύνδεσης (προσαρμόζεται ανάλογα με τον πίνακα στη Supabase σου)
            // Εδώ προσομοιώνουμε την ανάγνωση/εγγραφή για άμεση απόκριση στο ταμείο:
            currentCustomer = { phone: phone, name: 'Πελάτης ' + phone.slice(-4), points: 5 };
            
            document.getElementById('customerName').innerText = currentCustomer.name;
            document.getElementById('customerPoints').innerText = currentCustomer.points;
            document.getElementById('customerSection').style.display = 'block';
        }

        function addPoints(amount) {
            if (!currentCustomer) return;
            currentCustomer.points += amount;
            document.getElementById('customerPoints').innerText = currentCustomer.points;
            alert('Προστέθηκε 1 πόντος επιτυχώς!');
        }

        function redeemPoints() {
            if (!currentCustomer || currentCustomer.points < 10) {
                alert('Ο πελάτης δεν έχει αρκετούς πόντους για εξαργύρωση (απαιτούνται 10).');
                return;
            }
            currentCustomer.points -= 10;
            document.getElementById('customerPoints').innerText = currentCustomer.points;
            alert('Η εξαργύρωση ολοκληρώθηκε!');
        }
    </script>

</body>
</html>
